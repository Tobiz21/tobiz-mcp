<!doctype html>
<html lang="ru">
<head>

    #b_dark { background: #1d1d1d; color: #222; }

    #b_dark button { color: white; background: #1d1d1d; border: 0; padding: 12px 24px; }

  </style>
</head>
<body>
  <section id="b_dark"><div class="section_inner">
    <h2>Нечитаемый заголовок</h2>

    <button>Невидимая кнопка</button>
    <form>
      <input type="tel" name="phone" placeholder="Телефон">
      <button type="submit">Отправить</button>
    </form>
    <form>
      <input type="tel" name="phone2" placeholder="Телефон">
      <input name="name" placeholder="Имя">
      <button type="submit">Отправить</button>
    </form>
    <img src="missing-quality-fixture.jpg" alt="Намеренно битое изображение">

</html>
