<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font: 18px Arial, sans-serif; }
    .section_inner { width: 1100px; margin: 40px auto; }
    .grid { display: flex; gap: 20px; align-items: flex-start; }
    .card { width: 340px; border: 1px solid #ddd; position: relative; }
    .card:nth-child(1) { height: 300px; }
    .card:nth-child(2) { height: 350px; }
    .card:nth-child(3) { height: 320px; }
    .btn1 { position: absolute; left: 30px; top: 235px; padding: 12px 25px; background: #c00; color: white; }
    .card:nth-child(2) .btn1 { top: 285px; }
    .card:nth-child(3) .btn1 { opacity: 0; }
  </style>
</head>
<body>
  <section id="b_fixture"><div class="section_inner"><div class="grid">
    <article class="card"><h3>Карточка 1</h3><p>Короткий текст.</p><a class="btn1" href="#form">Подробнее</a></article>
    <article class="card"><h3>Карточка 2</h3><p>Более длинный текст, который меняет высоту карточки.</p><a class="btn1" href="#form">Подробнее</a></article>
    <article class="card"><h3>Карточка 3</h3><p>Кнопка скрыта до наведения.</p><a class="btn1" href="#form">Подробнее</a></article>
  </div></div></section>
  <form id="form"><input name="phone"><button>Отправить</button></form>
</body>
</html>
