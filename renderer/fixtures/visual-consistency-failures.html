<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font: 16px Arial, sans-serif; }
    .section_inner { width: 1100px; margin: 0 auto; }
    .grid { display: flex; gap: 20px; }
    .card { width: 340px; height: 360px; text-align: center; }
    .card img { display: block; width: 100%; object-fit: cover; }
    .card:nth-child(1) img { height: 160px; }
    .card:nth-child(2) img { height: 260px; }
    .card:nth-child(3) img { height: 100px; }
    .card:nth-child(1) h2 { font-family: Georgia, serif; }
    .card:nth-child(2) h2 { font-family: Verdana, sans-serif; }
    .card:nth-child(3) h2 { font-family: Impact, sans-serif; }
    .card p { font-family: Arial, sans-serif; font-size: 10px; }
    .btn1 { display: inline-block; padding: 10px 20px; background: #b00020; color: white; }
    #b_second { margin-top: 360px; }
  </style>
</head>
<body>
  <section id="b_cards"><div class="section_inner"><div class="grid">
    <article class="card"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="1"><h2>Первый формат</h2><p>Слишком мелкий текст.</p><a class="btn1" href="#contact">Подробнее</a></article>
    <article class="card"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="2"><h2>Второй формат</h2><p>Слишком мелкий текст.</p><a class="btn1" href="#contact">Подробнее</a></article>
    <article class="card"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="3"><h2>Третий формат</h2><p>Слишком мелкий текст.</p><a class="btn1" href="#contact">Подробнее</a></article>
  </div></div></section>
  <section id="b_second"><div class="section_inner"><h1>Контакты</h1><p id="contact">+7 900 000-00-00</p></div></section>
</body>
</html>
