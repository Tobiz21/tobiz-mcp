[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tobiz-mcp"
version = "0.9.0b2"
description = "MCP-сервер для управления сайтами конструктора TOBIZ через его внутренние эндпоинты"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "tobiz", "website-builder", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp==2.2.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[project.scripts]
tobiz-mcp = "tobiz_mcp.__main__:main"
tobiz-mcp-selftest = "tobiz_mcp.selftest:main"
tobiz-mcp-configure = "tobiz_mcp.configure:main"

[project.urls]
Homepage = "https://github.com/Tobiz21/tobiz-mcp"
Repository = "https://github.com/Tobiz21/tobiz-mcp"
Issues = "https://github.com/Tobiz21/tobiz-mcp/issues"
Changelog = "https://github.com/Tobiz21/tobiz-mcp/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
