name: Clean installation smoke test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-install.yml
      - server.json
      - scripts/mcp-smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve TOBIZ MCP from the official Registry
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          name = "io.github.Tobiz21/tobiz-mcp"
          url = "https://registry.modelcontextprotocol.io/v0.1/servers?search=" + urllib.parse.quote(name)
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          matches = [item["server"] for item in payload["servers"] if item["server"]["name"] == name]
          assert len(matches) == 1, f"Expected one Registry result for {name}, got {len(matches)}"
          server = matches[0]
          assert server["version"] == "0.9.0-beta.2"
          package = server["packages"][0]
          assert package["registryType"] == "oci"
          assert package["identifier"] == "ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2"
          print(package["identifier"])
          PY
      - name: Pull public image without GitHub login
        run: docker pull ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2
      - name: Verify Registry ownership label
        run: |
          test "$(docker image inspect ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2 \
            --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}')" \
            = "io.github.Tobiz21/tobiz-mcp"
      - name: Verify Python server and Node renderer
        run: |
          docker run --rm --entrypoint python ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2 -c \
            'from tobiz_mcp.config import Config; from tobiz_mcp.render.bridge import RenderBridge; b=RenderBridge(Config.from_env()); assert b.available; print("renderer: ready")'
      - name: Verify Chromium and renderer tests
        run: |
          docker run --rm --entrypoint sh ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2 -c \
            'chromium --version && cd /app/renderer && node --test vendor-runtime.test.js'
      - name: Verify safe configuration command
        run: |
          docker run --rm --entrypoint tobiz-mcp-configure \
            ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2 --help
      - name: Verify real MCP handshake and tool discovery
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/scripts/mcp-smoke.py:/tmp/mcp-smoke.py:ro" \
            ghcr.io/tobiz21/tobiz-mcp:0.9.0-beta.2 /tmp/mcp-smoke.py
