name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Install renderer dependencies
        run: npm ci --prefix renderer
      - name: Python tests
        run: python -m pytest -q
      - name: Renderer tests
        run: npm test --prefix renderer
      - name: Build Python package
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Build supported Docker distribution
        run: docker build -t tobiz-mcp:ci .
      - name: Validate MCP Registry manifest
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate server.json
