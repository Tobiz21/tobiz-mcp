name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Validate manifest
        run: ./mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        shell: bash
        run: |
          for attempt in {1..20}; do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "MCP Registry publication failed after $attempt attempts."
              exit 1
            fi

            echo "Package is not available to the registry yet; retrying in 15 seconds ($attempt/20)."
            sleep 15
          done
