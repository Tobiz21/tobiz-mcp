name: TOBIZ live contract

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    env:
      TOBIZ_EMAIL: ${{ secrets.TOBIZ_LIVE_TEST_EMAIL }}
      TOBIZ_PASSWORD: ${{ secrets.TOBIZ_LIVE_TEST_PASSWORD }}
      TOBIZ_LIVE_TEST_PROJECT_ID: ${{ vars.TOBIZ_LIVE_TEST_PROJECT_ID }}
      TOBIZ_LIVE_TEST_PAGE_ID: ${{ vars.TOBIZ_LIVE_TEST_PAGE_ID }}
      TOBIZ_ALLOWED_PROJECT_IDS: ${{ vars.TOBIZ_LIVE_TEST_PROJECT_ID }}
      TOBIZ_REQUIRE_PROJECT_ALLOWLIST: "true"
      TOBIZ_READ_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Check live-test configuration
        id: configured
        shell: bash
        run: |
          if [[ -n "$TOBIZ_EMAIL" && -n "$TOBIZ_PASSWORD" && -n "$TOBIZ_LIVE_TEST_PROJECT_ID" && -n "$TOBIZ_LIVE_TEST_PAGE_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TOBIZ live-test secrets or variables are not configured"
          fi
      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Install server and renderer
        if: steps.configured.outputs.ready == 'true'
        run: |
          python -m pip install -e .
          npm ci --prefix renderer
      - name: Run authenticated read-only contract
        if: steps.configured.outputs.ready == 'true'
        run: python scripts/live-contract.py
